<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 5 - Khoa CNTTKD</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, sans-serif; color: #333; }
        .best-shared { max-width: 1000px; margin: 60px auto; padding: 0 20px; text-align: center; }
        .logo { margin: 0 0 24px; }
        .logo img { width: 200px; max-width: 100%; height: auto; }
        h2 { margin: 0 0 24px; font-size: 42px; font-weight: normal; line-height: 1.3; }
        h2 strong { color: #00aeef; }
        .lead-text { margin: 0 0 34px; font-size: 15px; line-height: 1.6; }
        .btn-list { margin: 0; padding: 0; list-style: none; }
        .btn-list li { display: inline-block; margin: 6px 10px; }
        .btn-list a {
            display: inline-block; min-width: 160px; padding: 19px 26px;
            border-radius: 3px; background: #2d3032; color: white;
            text-decoration: none; font-size: 14px;
        }
        .btn-list a:hover { background: #006b73; }
        a:focus-visible { outline: 3px solid #00aeef; outline-offset: 4px; }
        @media (max-width: 600px) { h2 { font-size: 30px; } }
    </style>
</head>
<body>
    <section class="best-shared" lang="en">
        <p class="logo"><img src="BIT_logo.png" alt="UEH - Khoa Công nghệ thông tin kinh doanh"></p>
        <h2>Best <strong>Shared Hosting</strong> Company</h2>
        <p class="lead-text">With this responsive landing page template, you can promote your all hosting, domain and email services.</p>
        <ul class="btn-list">
            <li><a href="./">View Plans</a></li>
            <li><a href="./">All Features</a></li>
        </ul>
    </section>
</body>
</html>
