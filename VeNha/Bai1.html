<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 1 - Minh chứng hoàn thành game CSS</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 24px;
            font-family: Arial, sans-serif;
            color: #243746;
            background: #f3f6f8;
        }
        main { max-width: 1100px; margin: 0 auto; }
        h1 { margin: 0 0 12px; font-size: 28px; }
        p { line-height: 1.6; }
        .actions { display: flex; flex-wrap: wrap; gap: 12px; margin: 20px 0; }
        .actions a {
            display: inline-block;
            padding: 10px 16px;
            border-radius: 6px;
            background: #006b73;
            color: white;
            text-decoration: none;
        }
        .actions a:hover { background: #004e54; }
        a:focus-visible { outline: 3px solid #e69b00; outline-offset: 3px; }
        iframe {
            display: block;
            width: 100%;
            height: 80vh;
            min-height: 450px;
            border: 1px solid #cbd5dc;
            border-radius: 8px;
            background: white;
        }
        .note { font-size: 14px; color: #526574; }
        @media (max-width: 600px) {
            body { padding: 16px; }
            h1 { font-size: 24px; }
        }
    </style>
</head>
<body>
    <main>
        <h1>Bài 1: Hoàn thành game CSS</h1>
        <p>Minh chứng hoàn thành các level của hai game
            <a href="https://flukeout.github.io/" target="_blank" rel="noopener noreferrer">CSS Diner</a>
            và <a href="https://css-speedrun.netlify.app/" target="_blank" rel="noopener noreferrer">CSS Speedrun</a>.
        </p>
        <div class="actions">
            <a href="Bai1_MinhChung.pdf" target="_blank" rel="noopener noreferrer">Mở PDF trong tab mới</a>
            <a href="Bai1_MinhChung.pdf" download>Tải PDF minh chứng</a>
        </div>
        <iframe src="Bai1_MinhChung.pdf" title="PDF minh chứng hoàn thành bài 1"></iframe>

    </main>
</body>
</html>
